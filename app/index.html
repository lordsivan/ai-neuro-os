<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<title>NeuroOS · BA Preview (v0.0.1)</title>
<!--
  ai-neuro-os — Phase-1 BA-facing app, v0.0.1 PREVIEW.
  Self-contained (no build, no dependencies). MOCK COGNITION over the worked case (pat-001).
  This is a requirements/UX preview per docs/stack/design-decisions.md (ADR-0003):
  it shows the real Console (C7) end-user experience so a BA can understand the surface.
  It is NOT clinically validated, NOT a clinical product, and NOT yet contract-conformant
  (no layered modules / CI gates) — that comes once contracts/ has a tagged version to pin.
-->
<style>
  :root{
    --bg:#0b1220; --panel:#121a2b; --panel2:#0f1626; --line:#243049;
    --txt:#e7edf6; --muted:#93a1b8; --accent:#2dd4bf; --accent2:#38bdf8;
    --ok:#34d399; --cand:#f59e0b; --bad:#f87171; --chip:#1b2740;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:var(--accent2)}
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    padding-bottom:72px}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0e1626,#0b1220);
    border-bottom:1px solid var(--line);padding:10px 14px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
  .brand .dot{width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,var(--accent),#0e7490)}
  .brand small{font-weight:500;color:var(--muted)}
  .mockbar{background:#3a2a06;color:#fde68a;border:1px solid #6b4e07;border-radius:8px;
    padding:6px 9px;margin-top:8px;font-size:11.5px;font-weight:600;letter-spacing:.2px}
  .ask{display:flex;gap:7px;margin-top:9px}
  .ask input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  .ask button{background:var(--accent);color:#062b27;border:0;border-radius:10px;
    padding:0 14px;font-weight:700}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .trust{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);padding:5px 11px;font-size:12px;font-weight:600}
  .seg button.on{background:var(--chip);color:var(--txt)}
  main{padding:12px 14px;flex:1}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 2px 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;
    box-shadow:0 1px 0 #0a0f1c}
  .card h3{margin:0 0 4px;font-size:16px}
  .card .sub{color:var(--muted);font-size:12.5px}
  .kv{display:flex;justify-content:space-between;gap:10px;margin:3px 0;font-size:13.5px}
  .kv span:first-child{color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    border-radius:999px;padding:3px 9px;border:1px solid transparent;white-space:nowrap}
  .b-ok{background:rgba(52,211,153,.12);color:var(--ok);border-color:rgba(52,211,153,.35)}
  .b-cand{background:rgba(245,158,11,.10);color:var(--cand);border-color:rgba(245,158,11,.4);
    border-style:dashed}
  .b-mod{background:var(--chip);color:#cfe0ff;border-color:var(--line)}
  .b-prog{background:rgba(248,113,113,.12);color:var(--bad);border-color:rgba(248,113,113,.35)}
  .conf{height:6px;background:#0a1322;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:7px}
  .conf > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .btn{display:inline-block;background:var(--accent);color:#06231f;border:0;border-radius:10px;
    padding:9px 13px;font-weight:700;font-size:13px;margin-top:9px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .pill{font-size:11px;color:var(--muted);background:var(--chip);border:1px solid var(--line);
    border-radius:999px;padding:2px 8px}
  .timeline{position:relative;margin-left:8px;padding-left:16px;border-left:2px solid var(--line)}
  .tl{position:relative;margin:0 0 14px}
  .tl::before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg)}
  .tl.bad::before{background:var(--bad)}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#0c1424cc;
    backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px}
  nav.tabs button .i{font-size:18px;line-height:1}
  nav.tabs button.on{color:var(--accent)}
  .evlink{color:var(--accent2);font-size:12px;text-decoration:underline dotted}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#08312b;
    color:#bdfbef;border:1px solid #14b8a6;border-radius:10px;padding:9px 14px;font-size:13px;
    font-weight:600;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 0}
  .foot{color:var(--muted);font-size:11px;text-align:center;padding:18px 10px 6px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span> NeuroOS <small>· BA Preview v0.0.1</small></div>
    <div class="mockbar">⚠ MOCK DATA · not a real patient · not clinically validated · UX/requirements preview</div>
    <div class="ask">
      <input id="ask" placeholder="Ask… e.g. what's the diagnosis?" autocomplete="off" />
      <button onclick="ask()">Ask</button>
    </div>
    <div class="trust">
      <span>Trust:</span>
      <span class="seg">
        <button id="t-explore" class="on" onclick="setTrust('explore')">Explore</button>
        <button id="t-strict" onclick="setTrust('strict')">Strict</button>
      </span>
      <span class="small" id="trustNote">showing confirmed + candidate</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- worked-case data (mirrors samples/, mock) ---------- */
const DB = {
  patient:{ id:"pat-001", who:"52F", complaint:"3 weeks progressive headaches + right-arm weakness",
            comorbid:["hypertension"], onset:"2025-12-10" },
  lesion:{ id:"les-001", label:"Left frontal mass", nature:"neoplastic",
           location:"Left frontal lobe (MNI −32,24,28)" },
  findings:[
    { id:"find-ct-001", mod:"CT", date:"2025-12-31", kind:"Focal hypodense lesion",
      attrs:{Density:"hypodense", "Mass effect":"yes", "Midline shift":"4 mm"},
      meas:{"Diameter":"31 mm"}, by:"algorithm", conf:.86, status:"confirmed" },
    { id:"find-mri-001", mod:"MRI", date:"2026-01-02", kind:"Ring-enhancing mass",
      attrs:{FLAIR:"hyperintense", Enhancement:"ring", Diffusion:"rim restriction", Edema:"moderate"},
      meas:{"Volume":"18.4 ml","Diameter":"33 mm"}, by:"algorithm", conf:.91, status:"confirmed" },
    { id:"find-us-001", mod:"US", date:"2026-01-10", kind:"Echogenic intra-axial lesion (intra-op)",
      attrs:{Echogenicity:"hyperechoic", Margins:"ill-defined", Vascularity:"present"},
      meas:{"Diameter":"30 mm"}, by:"human", conf:.80, status:"confirmed" },
    { id:"find-histo-001", mod:"Histology", date:"2026-01-12", kind:"High-grade glial neoplasm (grade 4)",
      attrs:{Cellularity:"high", Mitoses:"frequent", Necrosis:"yes", "Microvasc. prolif.":"yes", Grade:"4"},
      meas:{"Ki-67":"28%"}, by:"human", conf:.98, status:"confirmed" }
  ],
  differential:[
    { id:"di-glioma", dx:"High-grade glioma", conf:.62,
      support:["ring enhancement","rim diffusion restriction","mass effect","precedent pat-417"], refute:[] },
    { id:"di-demyel", dx:"Tumefactive demyelination", conf:.23,
      support:["open-ring enhancement","precedent pat-512"], refute:["moderate mass effect","McDonald not met"] },
    { id:"di-abscess", dx:"Cerebral abscess", conf:.15,
      support:["ring enhancement"], refute:["rim (not central) restriction","no infective history"] }
  ],
  nextTest:{ test:"Biopsy / histology", why:"Resolves indeterminate WHO-CNS criteria and separates glioma vs demyelination vs abscess." },
  diagnosis:{ id:"dx-001", dx:"High-grade glioma", codes:"SNOMED 393563007", conf:.62, status:"candidate" },
  plan:{ id:"tx-001", intent:"curative",
    steps:["Maximal safe resection","Concurrent chemoradiation","Adjuvant chemotherapy","Interval MRI surveillance"],
    trial:{ id:"GBM-2026-A", elig:"eligible" }, status:"candidate" },
  progression:[
    { id:"prog-001", date:"2026-02-01", scheme:"RANO", verdict:"Stable", bad:false, note:"Post-op baseline; no measurable residual/new lesion." },
    { id:"prog-002", date:"2026-04-15", scheme:"RANO", verdict:"Progression", bad:true, note:"New enhancement at the resection margin (measurable increase)." }
  ],
  discovery:{
    findings:[
      { ref:"find-mri-cohort-417", pt:"pat-417", mod:"MRI", sim:.94 },
      { ref:"find-mri-cohort-088", pt:"pat-088", mod:"MRI", sim:.91 },
      { ref:"find-ct-cohort-203",  pt:"pat-203", mod:"CT",  sim:.88 }
    ],
    cases:[
      { pt:"pat-417", sim:.92, dx:"High-grade glioma", outcome:"progression at 4 months" },
      { pt:"pat-512", sim:.86, dx:"Tumefactive demyelination", outcome:"steroid-responsive (look-alike)" }
    ]
  }
};

/* ---------- ui state ---------- */
let trust = "explore";        // explore | strict
let tab = "overview";
const TABS = [
  ["overview","🧠","Overview"], ["findings","🔬","Findings"], ["dx","🩺","Diagnosis"],
  ["plan","💊","Plan"], ["timeline","📈","Timeline"], ["discover","🔎","Discover"]
];

const $ = s => document.querySelector(s);
const isConfirmed = s => s==="confirmed" || s==="active";
const showCand = () => trust==="explore";
function badge(status){
  return isConfirmed(status)
    ? `<span class="badge b-ok">✓ confirmed</span>`
    : `<span class="badge b-cand">◌ candidate</span>`;
}
function conf(c){ return `<div class="conf"><i style="width:${Math.round(c*100)}%"></i></div>
  <div class="small muted" style="margin-top:3px">confidence ${(c*100|0)}%</div>`; }

function setTrust(t){
  trust=t;
  $("#t-explore").classList.toggle("on",t==="explore");
  $("#t-strict").classList.toggle("on",t==="strict");
  $("#trustNote").textContent = t==="explore" ? "showing confirmed + candidate" : "confirmed only (clinical mode)";
  render();
}
function go(t){ tab=t; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- views ---------- */
function vOverview(){
  const p=DB.patient, l=DB.lesion, d=DB.diagnosis;
  return `
  <h2 class="sec">Patient</h2>
  <div class="card">
    <h3>${p.id} · ${p.who}</h3>
    <div class="sub">${p.complaint}</div>
    <div class="kv"><span>Comorbidities</span><span>${p.comorbid.join(", ")}</span></div>
    <div class="kv"><span>Symptom onset</span><span>${p.onset}</span></div>
  </div>
  <h2 class="sec">Lesion of interest</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h3>${l.label}</h3><span class="badge b-mod">${l.id}</span>
    </div>
    <div class="sub">${l.location} · ${l.nature}</div>
    <div class="legend" style="margin-top:9px">
      ${DB.findings.map(f=>`<span class="badge b-mod">${f.mod}</span>`).join("")}
    </div>
    <div class="small muted" style="margin-top:8px">Seen across 4 modalities — tap <b>Findings</b> to navigate the same lesion in each.</div>
  </div>
  <h2 class="sec">Where it stands</h2>
  <div class="card">
    <div class="kv"><span>Working diagnosis</span><span>${d.dx} ${badge(d.status)}</span></div>
    <div class="kv"><span>Treatment plan</span><span>${DB.plan.intent} ${badge(DB.plan.status)}</span></div>
    <div class="kv"><span>Latest assessment</span><span>${DB.progression.at(-1).verdict} <span class="badge ${DB.progression.at(-1).bad?'b-prog':'b-ok'}">${DB.progression.at(-1).scheme}</span></span></div>
  </div>`;
}

function vFindings(){
  return `<h2 class="sec">Cross-modal findings · one lesion</h2>
  ${DB.findings.filter(f=>showCand()||isConfirmed(f.status)).map(f=>`
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3>${f.kind}</h3><span class="badge b-mod">${f.mod}</span>
      </div>
      <div class="sub">${f.date} · ${f.id} · asserted by ${f.by} ${badge(f.status)}</div>
      ${Object.entries(f.attrs).map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("")}
      ${Object.entries(f.meas).map(([k,v])=>`<div class="kv"><span>${k}</span><span><b>${v}</b></span></div>`).join("")}
      ${conf(f.conf)}
    </div>`).join("")}
  <div class="card small muted">All four are <b>manifestation_of</b> the same lesion <b>les-001</b> — that shared node is what makes "find this finding in another modality" a single tap.</div>`;
}

function vDx(){
  const d=DB.diagnosis;
  const list = DB.differential.filter((x,i)=> showCand() || i===0);
  return `
  <h2 class="sec">Proposed diagnosis</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h3>${d.dx}</h3>${badge(d.status)}</div>
    <div class="sub">${d.id} · ${d.codes} · hybrid reasoner (rules + LLM)</div>
    ${conf(d.conf)}
    ${ isConfirmed(d.status)
      ? `<div class="small" style="margin-top:9px;color:var(--ok)">✓ Confirmed by you — promoted candidate→confirmed (Sentinel-governed).</div>`
      : `<button class="btn" onclick="confirmDx()">Confirm diagnosis</button>
         <button class="btn ghost" onclick="toast('Rejected — stays candidate')">Reject</button>
         <div class="small muted" style="margin-top:7px">Reasoner proposes; <b>you</b> confirm.</div>` }
  </div>
  <h2 class="sec">Differential ${showCand()?'':'<span class="pill">strict: top only</span>'}</h2>
  ${list.map(x=>`
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>${x.dx}</h3><span class="small muted">${(x.conf*100|0)}%</span></div>
      ${conf(x.conf)}
      <div class="small" style="margin-top:7px"><b style="color:var(--ok)">For:</b> ${x.support.join(" · ")||"—"}</div>
      <div class="small"><b style="color:var(--bad)">Against:</b> ${x.refute.join(" · ")||"—"}</div>
    </div>`).join("")}
  <h2 class="sec">Recommended next test</h2>
  <div class="card">
    <h3>${DB.nextTest.test}</h3>
    <div class="sub">${DB.nextTest.why}</div>
  </div>`;
}

function vPlan(){
  const t=DB.plan;
  return `
  <h2 class="sec">Treatment plan</h2>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h3>${t.id} · ${t.intent}</h3>${badge(t.status)}</div>
    <ol style="margin:8px 0 4px 18px;padding:0">${t.steps.map(s=>`<li style="margin:3px 0">${s}</li>`).join("")}</ol>
    <div class="kv" style="margin-top:6px"><span>Clinical trial</span><span>${t.trial.id} <span class="badge b-ok">${t.trial.elig}</span></span></div>
    ${ isConfirmed(t.status)
      ? `<div class="small" style="margin-top:9px;color:var(--ok)">✓ Approved by tumor board — status active.</div>`
      : `<button class="btn" onclick="confirmPlan()">Approve (MDT)</button>
         <div class="small muted" style="margin-top:7px">Pathways proposes; the tumor board approves before it is active.</div>` }
  </div>
  <div class="card small muted">Treatment is delegated to <b>Pathways (C5)</b>; this app (Console) only presents it and relays your decision.</div>`;
}

function vTimeline(){
  return `
  <h2 class="sec">Progression timeline</h2>
  <div class="card">
    <div class="timeline">
      ${DB.progression.map(p=>`
        <div class="tl ${p.bad?'bad':''}">
          <div class="row" style="justify-content:space-between">
            <b>${p.verdict}</b>
            <span class="badge ${p.bad?'b-prog':'b-ok'}">${p.scheme}</span>
          </div>
          <div class="small muted">${p.date} · ${p.id}</div>
          <div class="small" style="margin-top:3px">${p.note}</div>
        </div>`).join("")}
    </div>
    <div class="small muted">Monitoring is <b>event-driven</b>: each follow-up study auto-produces a RANO assessment on this lesion. A <b>Progression</b> verdict re-triggers planning.</div>
  </div>`;
}

function vDiscover(){
  if(!showCand()) return `<div class="card">Discovery surfaces <b>candidate</b> matches. Switch trust to <b>Explore</b> to view them.</div>`;
  const D=DB.discovery;
  return `
  <h2 class="sec">Similar findings (cohort)</h2>
  ${D.findings.map(f=>`
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>${f.pt}</h3><span class="badge b-mod">${f.mod}</span></div>
      <div class="sub">${f.ref} · embedding match ${badge('candidate')}</div>
      ${conf(f.sim)}
    </div>`).join("")}
  <h2 class="sec">Similar prior cases</h2>
  ${D.cases.map(c=>`
    <div class="card">
      <div class="row" style="justify-content:space-between"><h3>${c.pt}</h3><span class="small muted">${(c.sim*100|0)}%</span></div>
      <div class="kv"><span>Recorded diagnosis</span><span>${c.dx}</span></div>
      <div class="kv"><span>Outcome</span><span>${c.outcome}</span></div>
    </div>`).join("")}
  <div class="card small muted">Discovery (Recall, C3) only <b>proposes</b> look-alikes — incl. a different diagnosis worth ruling out. Nothing here is confirmed.</div>`;
}

const VIEWS = { overview:vOverview, findings:vFindings, dx:vDx, plan:vPlan, timeline:vTimeline, discover:vDiscover };

function render(){
  $("#view").innerHTML = VIEWS[tab]() + `
    <div class="foot">ai-neuro-os · Phase-1 BA preview v0.0.1 · MOCK cognition over the worked case (pat-001).<br>
    Not clinically validated. See docs/stack/design-decisions.md (ADR-0003).</div>`;
  $("#tabs").innerHTML = TABS.map(([id,ic,lbl])=>
    `<button class="${tab===id?'on':''}" onclick="go('${id}')"><span class="i">${ic}</span>${lbl}</button>`).join("");
}

/* ---------- interactions ---------- */
function confirmDx(){ DB.diagnosis.status="confirmed"; toast("Diagnosis confirmed → promoted"); render(); }
function confirmPlan(){ DB.plan.status="active"; toast("Plan approved by MDT → active"); render(); }
let tT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("show"),1900); }

function ask(){
  const q=($("#ask").value||"").toLowerCase().trim();
  if(!q){ return; }
  const map=[
    [/(diagnos|differential|what.*wrong|what.*is.*it)/,"dx"],
    [/(plan|treat|therapy|surgery|chemo)/,"plan"],
    [/(progress|response|rano|timeline|monitor|growing|worse)/,"timeline"],
    [/(similar|cohort|discover|seen.*before|other.*case)/,"discover"],
    [/(finding|mri|ct|ultrasound|histolog|biopsy|modal)/,"findings"]
  ];
  for(const [re,t] of map){ if(re.test(q)){ $("#ask").value=""; toast("→ "+TABS.find(x=>x[0]===t)[2]); go(t); return; } }
  toast("Showing overview"); go("overview");
}
$("#ask").addEventListener("keydown",e=>{ if(e.key==="Enter") ask(); });

render();
</script>
</body>
</html>
